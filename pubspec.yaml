name: zip_to_apk
description: Build Flutter zip into APK via GitHub Actions
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  file_picker: ^8.0.0
  shared_preferences: ^2.2.0
  archive: ^3.6.0
  path_provider: ^2.1.0
  open_filex: ^4.4.0

flutter:
  uses-material-design: true
